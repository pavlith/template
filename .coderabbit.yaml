# https://docs.coderabbit.ai/getting-started/configure-coderabbit
language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  review_status: false

  # Files where a line-by-line AI review is noise rather than signal.
  path_filters:
    - '!**/*.md'
    - '!pnpm-lock.yaml'
    # Generated by Wails — regenerate, never hand-edit.
    - '!bindings/**'
    # Vendored shadcn-svelte output.
    - '!src/lib/components/ui/**'
    # Translation catalogues; changes are content, not code.
    - '!locales/**'

  path_instructions:
    - path: 'src/lib/stores/**'
      instructions: >-
        Values crossing the Wails IPC boundary must be unwrapped with
        $state.snapshot() — a raw Svelte 5 rune proxy does not serialise. Any
        store that debounces writes must expose a flush and be registered in
        flushAllStores() in src/lib/lifecycle.ts.
    - path: 'src/**'
      instructions: >-
        Go is called through the generated bindings in
        $lib/wails-bindings. Logging goes through
        $lib/logger rather than console. User-facing strings come from
        i18next translation keys, not literals.
    - path: '**/*.go'
      instructions: >-
        Regenerate TypeScript bindings with pnpm bindings when a bound Go
        service changes. Keep the settings JSON schema compatible.

chat:
  auto_reply: true
